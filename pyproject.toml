[project]
name = "bolt-thesis"
version = "0.6.0"
description = "LLM + rule-engine master's thesis experiment for bolt manufacturing master data"
requires-python = ">=3.10,<3.13"
dependencies = [
  "openai>=1.0.0",
  "vllm>=0.12.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bolt_thesis"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
